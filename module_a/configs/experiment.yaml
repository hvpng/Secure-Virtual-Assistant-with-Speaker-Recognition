experiment:
  name: vietnam_celeb_speaker_recognition
  current_milestone: A4

seed: 42

model:
  architecture: wavlm_base_plus_campp
  wavlm_model_name: microsoft/wavlm-base-plus
  wavlm_frozen: true
  # Stage 2 is a future option only; A2/A3 keep WavLM frozen.
  stage2_enabled: false
  wavlm_hidden_dimension: 768
  adapter_dimension: 80
  embedding_dimension: 192
  # CAM++ paper/3D-Speaker engineering defaults; tests inject a smaller topology.
  campp_growth_rate: 32
  campp_block_layers: [12, 24, 16]
  campp_init_channels: 128
  campp_bottleneck_channels: 128
  campp_fcm_channels: 32
  campp_segment_frames: 100

audio:
  sample_rate: 16000
  segment_seconds: 3.0

loss:
  type: aam_softmax
  margin: 0.2
  scale: 30.0

training:
  epochs: 3
  # null is deliberate: the real-data CLI requires --mini or an explicit
  # --max-steps so invoking it cannot accidentally launch an unbounded run.
  max_steps: null
  mixed_precision: true
  # Monitor loss favors numerical robustness over throughput.
  monitor_mixed_precision: false
  # Engineering starting points only; these are not tuned hyperparameters.
  learning_rate: 0.001
  weight_decay: 0.0001
  speakers_per_batch: 16
  utterances_per_speaker: 2
  num_workers: 2
  gradient_accumulation_steps: 1
  log_every_steps: 10
  val_every_steps: 2171
  save_every_steps: 2171
  max_train_speakers: null
  max_monitor_speakers: 100
  monitor_holdout_ratio: 0.1
  # Abort instead of retrying forever if lowering the AMP scale never recovers.
  max_consecutive_amp_overflows: 20

scheduler:
  type: cosine
  warmup_steps: 0

evaluation:
  # A4 scoring is FP32 by default for numerical robustness.
  mixed_precision: false
  embedding_batch_size: 8
  max_sv_positive_per_speaker: 20
  sid_known_ratio: 0.8
  sid_max_enrollment: 5

output:
  # Resolved relative to module_a/ unless overridden by CLI.
  root: outputs

runtime_contract:
  load_model: 'load_model(model_dir, device="auto")'
  extract_embedding: 'extract_embedding(model, audio_path)'
